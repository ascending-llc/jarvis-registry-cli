version: "2"
run:
  modules-download-mode: readonly
output:
  sort-order:
    - file
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - copyloopvar
    - decorder
    - depguard
    - dogsled
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - gocheckcompilerdirectives
    - gochecknoinits
    - gosec
    - govet
    - ineffassign
    - intrange
    - musttag
    - nestif
    - nlreturn
    - nolintlint
    - sloglint
    - staticcheck
    - thelper
    - unused
    - wsl_v5
  settings:
    asasalint:
      use-builtin-exclusions: true
    decorder:
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: false
      disable-type-dec-num-check: false
      disable-const-dec-num-check: false
      disable-var-dec-num-check: false
    depguard:
      rules:
        avoid-list:
          list-mode: lax
          deny:
            - pkg: github.com/aws/aws-sdk-go$
              desc: v1 of AWS Go SDK reaches EOL on July 31, 2025.

            - pkg: io/ioutil
              desc: Deprecated since Go 1.16. Use os and io instead.

            - pkg: github.com/pkg/errors
              desc: This package has been archived. Use standard library package errors instead.

            - pkg: github.com/lib/pq
              desc: This package has gone into maintenance only mode. Use its new version instead.

            - pkg: github.com/bouk/monkey
              desc: Use methodical dependency injection instead of monkeypatching.

            - pkg: github.com/agiledragon/gomonkey
              desc: Use methodical dependency injection instead of monkeypatching.

            - pkg: github.com/gin-gonic/gin
              desc: This web framework doesn't fully support the http.Handler interface.

            - pkg: github.com/labstack/echo
              desc: This web framework doesn't fully support the http.Handler interface.

            - pkg: github.com/gofiber/fiber
              desc: This web framework doesn't fully support the http.Handler interface.
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      attr-only: true
      no-global: all
      context: all
      static-msg: true
    wsl_v5:
      allow-first-in-block: false
      allow-whole-block: true
      branch-max-lines: 4
  exclusions:
    generated: lax
    rules:
      - path: '^auth/auth\.go$'
        linters:
          - gosec
        # this is an OAuth endpoint URL path, not a credential value
        text: 'G101: Potential hardcoded credentials'
      - path: '^auth/auth\.go$'
        linters:
          - gosec
        # only marshaled to hand off to creds.Write, which stores it in the OS keyring; never logged or written to disk
        text: 'G117: Marshaled struct field "AccessToken" \(JSON key "access_token"\) matches secret pattern'
      - path: '^skills/client\.go$'
        linters:
          - staticcheck
        # "Registry" is the proper-noun product name, capitalized consistently elsewhere in this codebase
        text: 'ST1005: error strings should not be capitalized'
      - path: '^skills/manifest\.go$'
        linters:
          - gosec
        # skill-lock.json holds only skill id/name/version metadata, no secrets; 0644/0444 is intentional so it stays world-readable but toggled read-only
        text: 'G302: Expect file permissions to be 0600 or less'
      - path: '^skills/(manifest|skills)\.go$'
        linters:
          - gosec
        # manifest and synced SKILL.md files hold no secrets; world-readability is intended
        text: 'G306: Expect WriteFile permissions to be 0600 or less'
      - path: '^skills/skills\.go$'
        linters:
          - gosec
        # synced skills folder holds only downloaded SKILL.md docs, no secrets
        text: 'G301: Expect directory permissions to be 0750 or less'
      - path: '^skills/skills_test\.go$'
        linters:
          - gosec
        # mock bearer token used only to assert the Authorization header sent to the test HTTP server, not a real credential
        text: 'G101: Potential hardcoded credentials'
      - path: '^skills/skills_test\.go$'
        linters:
          - gosec
        # mocked registry directory under a temp test home dir, not a real deployment path
        text: 'G301: Expect directory permissions to be 0750 or less'
      - path: '^skills/skills_test\.go$'
        linters:
          - gosec
        # manifest fixture written to a temp test dir; 0444 mirrors the production read-only permissions and holds no secrets
        text: 'G306: Expect WriteFile permissions to be 0600 or less'
      - path: '^skills/skills_test\.go$'
        linters:
          - gosec
        # paths are built from package constants and names enumerated from local testdata fixtures, not from untrusted input
        text: 'G304: Potential file inclusion via variable'
      - path: '^skills/skills_test\.go$'
        linters:
          - gosec
        # taint-analysis variant of the G304 finding above: path is built from a locally-created os.MkdirTemp dir plus compile-time constants, not from an actual taint source (env vars, HTTP requests, etc.)
        text: 'G703: Path traversal via taint analysis'
      - path: '^auth/auth_test\.go$'
        linters:
          - gosec
        # fixture token values used only to assert round-tripping through the mocked keyring and test HTTP server, not real credentials
        text: 'G101: Potential hardcoded credentials'
      - path: '^auth/auth_test\.go$'
        linters:
          - gosec
        # only marshaled to seed the mocked keyring for test setup; never logged or written to disk
        text: 'G117: Marshaled struct field "AccessToken" \(JSON key "access_token"\) matches secret pattern'
    paths:
      - adhoc/

issues:
  max-issues-per-linter: 0      
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
    