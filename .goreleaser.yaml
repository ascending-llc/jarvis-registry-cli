version: 2
project_name: jarvis-registry

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/jarvis-registry
    binary: jarvis-registry
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    hooks:
      post:
        - cmd: ./scripts/sign-windows.sh "{{ .Os }}" "{{ .Path }}"
          output: true

archives:
  - formats: [tar.gz]
    files:
      - license*
      - LICENSE*
      - readme*
      - README*
      - changelog*
      - CHANGELOG*
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

release:
  name_template: "Jarvis Registry CLI {{ .Tag }}"

brews:
  - name: jarvis-registry
    repository:
      owner: ascending-llc
      name: homebrew-jarvis
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://jarvisregistry.com/"
    description: "Companion CLI for the Jarvis Registry platform."
    license: "Apache-2.0"
    extra_install: |
      bash_completion.install "completions/jarvis-registry.bash" => "jarvis-registry"
      bash_completion.install_symlink "jarvis-registry" => "jr"
      zsh_completion.install "completions/jarvis-registry.zsh" => "_jarvis-registry"
      fish_completion.install "completions/jarvis-registry.fish"
      fish_completion.install "completions/jr.fish"
      bin.install_symlink "jarvis-registry" => "jr"
    caveats: |
      Run these once, in order, to get started:
        1. jarvis-registry configure   - set the Registry base URL and skills sync mode
        2. jarvis-registry auth login  - sign in via browser (cached in your OS keyring)
        3. jarvis-registry skills sync - pull the skills you have access to

      Run `jarvis-registry --help` for the full flag reference.

      A `jr` symlink has also been installed as a shorthand for `jarvis-registry`.
    test: |
      system "#{bin}/jarvis-registry", "--version"
      system "#{bin}/jarvis-registry", "-v"

winget:
  - name: jarvis-registry
    publisher: ASCENDING
    publisher_url: "https://ascendingdc.com"
    publisher_support_url: "https://github.com/ascending-llc/jarvis-registry-cli/issues/new"
    package_identifier: Ascending.JarvisRegistryCLI
    short_description: "Companion CLI for the Jarvis Registry platform."
    license: "Apache-2.0"
    homepage: "https://jarvisregistry.com/"
    skip_upload: auto
    commit_author:
      name: "ryo"
      email: "429620+ryohang@users.noreply.github.com"
    repository:
      owner: ascending-llc
      name: winget-pkgs
      token: "{{ .Env.WINGET_PKGS_TOKEN }}"
      branch: "jarvis-registry-{{ .Version }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
