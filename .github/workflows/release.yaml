name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.24.1"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.GH_COPILOT_KEY }}

      - name: Mirror release to jarvis-registry
        env:
          GH_TOKEN: ${{ secrets.GH_COPILOT_KEY }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MIRROR_TAG="cli-v${VERSION}"
          gh release create "$MIRROR_TAG" \
            --repo ascending-llc/jarvis-registry \
            --target main \
            --title "Jarvis Registry CLI ${TAG}" \
            --notes "Companion CLI release. Full release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --latest=false \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
