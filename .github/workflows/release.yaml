name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.24.1"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Artifact Signing access token
        run: |
          token="$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)"
          echo "::add-mask::$token"
          echo "AZURE_CODESIGNING_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install jsign
        run: |
          jar="$RUNNER_TEMP/jsign-7.5.jar"
          curl -fsSL -o "$jar" https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar
          echo "602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c  $jar" | sha256sum -c -
          echo "JSIGN_JAR=$jar" >> "$GITHUB_ENV"

      - name: Resolve previous tag
        id: resolve_prev
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "📋 Previous release tag: ${PREV_TAG:-<none>}"
          echo "📋 New release tag:      $GITHUB_REF_NAME"

      # Best-effort: a Copilot outage, expired PAT or unshared secret must never block
      # shipping binaries, so failures fall back to GoReleaser's own changelog.
      - name: Generate release notes with Copilot
        id: notes
        if: steps.resolve_prev.outputs.prev_tag != ''
        uses: github/copilot-release-notes@v1
        timeout-minutes: 10
        continue-on-error: true
        with:
          base-ref: ${{ steps.resolve_prev.outputs.prev_tag }}
          head-ref: ${{ github.ref_name }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_KEY_PERSONAL }}

      # Pass the notes via env var and file, never inline ${{ }} in run:, so LLM output
      # containing quotes or `$` can't break or inject into the shell.
      - name: Prepare release notes file
        id: notes_file
        env:
          RELEASE_NOTES: ${{ steps.notes.outputs['release-notes'] }}
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
            echo "args=--release-notes=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Copilot release notes unavailable; falling back to GoReleaser's changelog."
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          # Temporary: skip winget until microsoft/winget-pkgs#439002 (first submission) merges,
          # so releases don't open a duplicate new-package PR. Remove once it's merged.
          args: release --clean --skip=winget ${{ steps.notes_file.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.GH_COPILOT_KEY }}
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}

      - name: Mirror release to jarvis-registry
        env:
          GH_TOKEN: ${{ secrets.GH_COPILOT_KEY }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          MIRROR_TAG="cli-v${VERSION}"
          gh release create "$MIRROR_TAG" \
            --repo ascending-llc/jarvis-registry \
            --target main \
            --title "Jarvis Registry CLI ${TAG}" \
            --notes "Companion CLI release. Full release notes: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}" \
            --latest=false \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
