# Temporary (AS-1874): validates Windows signing end-to-end without a tag.
# Delete this file before merging feature/as-1874.
name: Sign check

on:
  push:
    branches:
      - feature/as-1874

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.24.1"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Artifact Signing access token
        run: |
          token="$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)"
          echo "::add-mask::$token"
          echo "AZURE_CODESIGNING_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Install jsign
        run: |
          jar="$RUNNER_TEMP/jsign-7.5.jar"
          curl -fsSL -o "$jar" https://github.com/ebourg/jsign/releases/download/7.5/jsign-7.5.jar
          echo "602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c  $jar" | sha256sum -c -
          echo "JSIGN_JAR=$jar" >> "$GITHUB_ENV"

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows archives
        uses: actions/upload-artifact@v4
        with:
          name: windows-zips
          path: dist/*_windows_*.zip
          if-no-files-found: error

  verify:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download Windows archives
        uses: actions/download-artifact@v4
        with:
          name: windows-zips
          path: zips

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publicTrustEku = '1.3.6.1.4.1.311.97.1.0'

          $zips = @(Get-ChildItem -Path zips -Filter '*.zip')
          foreach ($arch in 'windows_amd64', 'windows_arm64') {
              if (-not ($zips | Where-Object Name -like "*_${arch}*.zip")) {
                  throw "missing archive for $arch"
              }
          }

          $failed = $false
          foreach ($zip in $zips) {
              Write-Host "=== $($zip.Name) ==="
              $dest = Join-Path $env:RUNNER_TEMP $zip.BaseName
              Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
              $exe = Join-Path $dest 'jarvis-registry.exe'

              $sig = Get-AuthenticodeSignature -FilePath $exe
              $cert = $sig.SignerCertificate
              $ekus = @(
                  $cert.Extensions |
                      Where-Object { $_ -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension] } |
                      ForEach-Object { $_.EnhancedKeyUsages } |
                      ForEach-Object { $_.Value }
              )

              Write-Host "Status: $($sig.Status) ($($sig.StatusMessage))"
              if ($sig.Status -ne 'Valid') { Write-Host '::error::signature status is not Valid'; $failed = $true }
              if ($null -eq $sig.TimeStamperCertificate) { Write-Host '::error::signature has no timestamp'; $failed = $true }
              if ($ekus -notcontains $publicTrustEku) { Write-Host "::error::signer lacks EKU $publicTrustEku"; $failed = $true }
              if ($null -eq $cert) { continue }

              Write-Host "Subject:   $($cert.Subject)"
              Write-Host "Issuer:    $($cert.Issuer)"
              Write-Host "NotBefore: $($cert.NotBefore.ToString('o'))"
              Write-Host "NotAfter:  $($cert.NotAfter.ToString('o'))"
              if ($sig.TimeStamperCertificate) {
                  Write-Host "Timestamper: $($sig.TimeStamperCertificate.Subject)"
              }

              Write-Host 'Artifact Signing EKUs (the one other than .1.0 is the durable identity EKU):'
              $ekus | Where-Object { $_ -like '1.3.6.1.4.1.311.97.*' } | ForEach-Object { Write-Host "  $_" }

              Write-Host 'Chain (leaf first, root last):'
              $chain = [System.Security.Cryptography.X509Certificates.X509Chain]::new()
              [void]$chain.Build($cert)
              foreach ($element in $chain.ChainElements) {
                  Write-Host "  $($element.Certificate.Subject)"
                  Write-Host "    Thumbprint: $($element.Certificate.Thumbprint)"
              }

              foreach ($oid in '2.5.29.31', '1.3.6.1.5.5.7.1.1') {
                  $ext = $cert.Extensions | Where-Object { $_.Oid.Value -eq $oid }
                  if ($ext) {
                      Write-Host "$($ext.Oid.FriendlyName) ($oid):"
                      Write-Host $ext.Format($true)
                  } else {
                      Write-Host "Extension $oid not present"
                  }
              }
          }

          if ($failed) { exit 1 }
