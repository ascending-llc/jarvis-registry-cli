[tool.tartufo]
repo-path = "."
regex = true
entropy = true

exclude-path-patterns = [
    {path-pattern = 'go\.mod$', reason = 'go.mod file'},
    {path-pattern = 'go\.sum$', reason = 'go.sum file'},
    {path-pattern = 'tartufo\.toml$', reason = 'Tartufo config file'},
    {path-pattern = 'skills/testdata', reason = 'testdata files'},
]

exclude-entropy-patterns = [
    # Public SHA-256 digest of the pinned jsign release jar, used to verify the download.
    {path-pattern = '\.github/workflows/.*\.yaml$', pattern = '602a51c3545a6dc4fb99bd2ea7152b26d1345916d0c93ddfbd5936cb735af91c', reason = 'jsign 7.5 jar SHA-256 digest'},
]

exclude-signatures = [
    {signature = "1a69820961db4e145e71c398e069023feda97a54014f717d5ea80bd472932c64", reason = "Fake malformed URL password in skills credential-redaction regression test"},
    {signature = "e06f475ddc160d8af612801b9b7fc114bc9946388696a9a00f209233a434342a", reason = "Fake URL password in cfg credential-redaction regression test"},
    {signature = "0ca3348ec5df3d504e5b6f6c1c7c888821680398798990f76dffbf633ebed184", reason = "Fake URL password in skills unsafe-origin rejection test"},
]
