default_language_version:
  python: python3.14

repos:
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      - id: golangci-lint-config-verify
      - id: golangci-lint-fmt
      - id: golangci-lint-full

  - repo: https://github.com/satoseino/gelato
    rev: v0.1.0
    hooks:
      - id: gelato
      # `make gelato`: scan the history instead of staged changes. Not run on commit.
      - id: gelato
        alias: gelato-scan
        name: gelato scan
        args: [scan]
        stages: [manual]
